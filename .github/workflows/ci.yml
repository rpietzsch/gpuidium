name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libvulkan1 xvfb
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.1", components: "rustfmt,clippy" }
      - uses: arduino/setup-task@v2
        with: { version: 3.x }
      - uses: Swatinem/rust-cache@v2
      - run: task check
      # Browser-engine regressions need a display: PROFILE-002/004 isolation and OIDC persistence.
      - run: xvfb-run -a task test:isolation
      - run: xvfb-run -a task test:oidc
