version: "3"

# Single entry point for build/lifecycle targets. Run `task` to list them.
# Linux prerequisites: GTK3, WebKitGTK 4.1, X11 libs (see README).

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  clean:
    desc: Remove build artifacts
    cmds:
      - cargo clean

  build:
    desc: Build all crates (debug)
    cmds:
      - cargo build --workspace

  build:release:
    desc: Build all crates (release)
    cmds:
      - cargo build --workspace --release

  run:
    desc: Run the GPUIdium app
    cmds:
      - cargo run -p gpuidium -- {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmds:
      - cargo test --workspace

  fmt:
    desc: Format all code
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run clippy with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  check:
    desc: CI gate - format check, lint, test
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
