version: "3"

# Single entry point for build/lifecycle targets. Run `task` to list them.
# Linux prerequisites: GTK3, WebKitGTK 4.1, X11 libs (see README).

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  clean:
    desc: Remove build artifacts
    cmds:
      - cargo clean

  build:
    desc: Build all crates (debug)
    cmds:
      - cargo build --workspace

  build:release:
    desc: Build all crates (release)
    cmds:
      - cargo build --workspace --release

  run:
    desc: "Run the GPUIdium app (release build; a debug build starts ~1.7x slower)"
    cmds:
      - cargo run --release -p gpuidium --bin gpuidium -- {{.CLI_ARGS}}

  run:debug:
    desc: Run the GPUIdium app as a debug build
    cmds:
      - cargo run -p gpuidium --bin gpuidium -- {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmds:
      - cargo test --workspace

  fmt:
    desc: Format all code
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run clippy with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  check:
    desc: CI gate - format check, lint, test
    cmds:
      - task: fmt:check
      - task: lint
      - task: test

  test:isolation:
    desc: Same-origin profile isolation + restart persistence (needs a display; PROFILE-002/004)
    cmds:
      - cargo build -q -p gpuidium --bin spike_isolation
      - cmd: |
          R=$(mktemp -d)
          target/debug/spike_isolation "$R"
          target/debug/spike_isolation "$R" --expect-persisted
          # PROFILE-004: nothing may land in shared per-user default dirs.
          ! test -e "$HOME/.cache/spike_isolation" && ! test -e "$HOME/.local/share/spike_isolation"
        platforms: [linux]
      - cmd: |
          # macOS: one WKWebsiteDataStore per profile UUID (needs macOS 14+).
          R=$(mktemp -d)
          target/debug/spike_isolation "$R"
          target/debug/spike_isolation "$R" --expect-persisted
        platforms: [darwin]
      # Windows: one WebView2 user-data folder per profile; PROFILE-004: no shared
      # `<exe>.WebView2` default folder next to the binary.
      - cmd: powershell -NoProfile -Command '$env:GPUI_DISABLE_DIRECT_COMPOSITION = "1"; $r = Join-Path $env:TEMP ([guid]::NewGuid()); & target/debug/spike_isolation.exe $r; if ($LASTEXITCODE) { exit $LASTEXITCODE }; & target/debug/spike_isolation.exe $r --expect-persisted; if ($LASTEXITCODE) { exit $LASTEXITCODE }; if (Test-Path target/debug/spike_isolation.exe.WebView2) { exit 1 }'
        platforms: [windows]

  test:oidc:
    desc: Mock OIDC login flow persists across restart and stays per-profile (needs a display)
    cmds:
      - cargo build -q -p gpuidium --bin spike_oidc
      - cmd: |
          R=$(mktemp -d)
          target/debug/spike_oidc "$R" --expect login
          target/debug/spike_oidc "$R" --expect rp
          target/debug/spike_oidc "$R" --profile other --expect login
          target/debug/spike_oidc "$R" --expect rp
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command '$env:GPUI_DISABLE_DIRECT_COMPOSITION = "1"; $r = Join-Path $env:TEMP ([guid]::NewGuid()); foreach ($a in @(@("--expect", "login"), @("--expect", "rp"), @("--profile", "other", "--expect", "login"), @("--expect", "rp"))) { & target/debug/spike_oidc.exe $r @a; if ($LASTEXITCODE) { exit $LASTEXITCODE } }'
        platforms: [windows]

  bench:
    desc: Process-tree memory/CPU baseline (Linux, needs display + xdotool)
    cmds:
      - cargo build --release -p gpuidium
      - python3 scripts/bench.py {{.CLI_ARGS}}

  package:linux:
    desc: Build dist/gpuidium-<ver>-linux-x86_64.tar.gz
    cmds:
      - scripts/package-linux.sh
    platforms: [linux]

  package:macos:
    desc: Build dist/GPUIdium.app and dist/gpuidium-<ver>-macos-<arch>.zip (ad-hoc signed)
    cmds:
      - scripts/package-macos.sh
    platforms: [darwin]

  install:macos:
    desc: Build the app bundle and copy it to /Applications (replaces an existing GPUIdium.app; quit it first)
    deps: [package:macos]
    cmds:
      - rm -rf /Applications/GPUIdium.app
      - ditto dist/GPUIdium.app /Applications/GPUIdium.app
      - echo "installed /Applications/GPUIdium.app"
    platforms: [darwin]

  install:linux:
    desc: Build and install to ~/.local (binary, desktop entry, icon); PREFIX=/usr/local for system-wide
    cmds:
      - scripts/install-linux.sh
    platforms: [linux]

  install:arch:
    desc: Build an Arch package from git HEAD with packaging/arch/PKGBUILD and install it via pacman -U
    cmds:
      - scripts/install-arch.sh
    platforms: [linux]

  install:win:
    desc: Build (shared target/ cache) and install per user to %LOCALAPPDATA%\Programs\GPUIdium with Start menu entry; uninstall via Settings > Apps
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows.ps1
    platforms: [windows]

  release:linux:
    desc: Package, checksum and (with GPUIDIUM_SIGN_KEY set) GPG-sign the Linux tarball, then verify it
    cmds:
      - scripts/release-linux.sh
    platforms: [linux]

  test:switching:
    desc: "Regression: switching apps keeps the page full size, resize works (needs a display and xdotool; uses the release build)"
    cmds:
      - cargo build --release -p gpuidium --bin gpuidium
      - scripts/test_switching.py
    platforms: [linux]
