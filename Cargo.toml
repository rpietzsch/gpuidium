[workspace]
resolver = "2"
members = ["crates/gpuidium-core", "crates/gpuidium"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rpietzsch/gpuidium"
version = "0.3.1"

[profile.release]
# Smaller binaries for packages (debug info is not needed in releases).
strip = true

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# PROFILE-004: lb-wry 0.53.3 with per-profile cache/HSTS dirs on Linux (third_party/lb-wry/PATCHES.md).
[patch.crates-io]
lb-wry = { path = "third_party/lb-wry" }
